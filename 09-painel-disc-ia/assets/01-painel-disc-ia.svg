<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Painel gerencial DISC com análise por IA</title>
  <desc id="desc">Painel demonstrativo com filtros, resultados fictícios, gráfico DISC e resumo comportamental.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17191a"/><stop offset="1" stop-color="#25292b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="72" fill="#9aaa87" font-family="Arial" font-size="19" font-weight="700" letter-spacing="4">GRUPO CULINÊ · PESSOAS</text>
  <text x="80" y="130" fill="#f3f0e9" font-family="Georgia" font-size="50" font-weight="700">DISC Gerencial</text>
  <text x="80" y="170" fill="#bfc2be" font-family="Arial" font-size="21">Consulta de perfis comportamentais com interpretação por IA.</text>

  <g font-family="Arial">
    <rect x="80" y="215" width="1440" height="92" rx="22" fill="#292d2f" stroke="#4c5355"/>
    <text x="110" y="245" fill="#9aaa87" font-size="13" font-weight="700">COLABORADOR</text>
    <rect x="110" y="256" width="430" height="34" rx="9" fill="#1e2122"/>
    <text x="128" y="278" fill="#bfc2be" font-size="14">Buscar por nome...</text>
    <text x="580" y="245" fill="#9aaa87" font-size="13" font-weight="700">PERÍODO</text>
    <rect x="580" y="256" width="190" height="34" rx="9" fill="#1e2122"/><rect x="788" y="256" width="190" height="34" rx="9" fill="#1e2122"/>
    <text x="598" y="278" fill="#bfc2be" font-size="14">01/09/2026</text><text x="806" y="278" fill="#bfc2be" font-size="14">30/09/2026</text>
    <rect x="1260" y="246" width="220" height="46" rx="13" fill="#798768"/>
    <text x="1370" y="275" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Buscar resultados</text>

    <g filter="url(#shadow)">
      <rect x="80" y="340" width="850" height="460" rx="26" fill="#292d2f" stroke="#4c5355"/>
      <rect x="970" y="340" width="550" height="460" rx="26" fill="#292d2f" stroke="#4c5355"/>
    </g>

    <text x="112" y="382" fill="#f3f0e9" font-size="22" font-weight="700">Resultados</text>
    <g fill="#9aaa87" font-size="13" font-weight="700">
      <text x="112" y="425">DATA</text><text x="250" y="425">COLABORADOR</text><text x="610" y="425">D</text><text x="675" y="425">I</text><text x="740" y="425">S</text><text x="805" y="425">C</text>
    </g>
    <line x1="112" y1="440" x2="895" y2="440" stroke="#4c5355"/>
    <g font-size="15">
      <g fill="#f3f0e9"><text x="112" y="480">23/09/2026</text><text x="250" y="480" font-weight="700">Marina Alves</text><text x="610" y="480">28</text><text x="675" y="480">21</text><text x="740" y="480">31</text><text x="805" y="480">20</text></g>
      <rect x="112" y="502" width="783" height="66" rx="14" fill="#303537"/>
      <g fill="#f3f0e9"><text x="128" y="541">18/09/2026</text><text x="266" y="541" font-weight="700">Lucas Ribeiro</text><text x="626" y="541">22</text><text x="691" y="541">33</text><text x="756" y="541">27</text><text x="821" y="541">18</text></g>
      <g fill="#f3f0e9"><text x="112" y="610">12/09/2026</text><text x="250" y="610" font-weight="700">Carla Santos</text><text x="610" y="610">19</text><text x="675" y="610">24</text><text x="740" y="610">35</text><text x="805" y="610">22</text></g>
    </g>
    <rect x="112" y="690" width="250" height="52" rx="14" fill="#798768"/><text x="237" y="722" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">PDF + análise IA</text>

    <text x="1005" y="382" fill="#9aaa87" font-size="14" font-weight="700" letter-spacing="2">RESUMO IA</text>
    <text x="1005" y="420" fill="#f3f0e9" font-family="Georgia" font-size="28" font-weight="700">Perfil comportamental</text>
    <g transform="translate(1005 454)">
      <rect width="70" height="92" rx="15" fill="#303537"/><rect x="86" width="70" height="92" rx="15" fill="#303537"/><rect x="172" width="70" height="92" rx="15" fill="#798768"/><rect x="258" width="70" height="92" rx="15" fill="#303537"/>
      <text x="35" y="35" text-anchor="middle" fill="#9aaa87" font-size="18" font-weight="700">D</text><text x="35" y="68" text-anchor="middle" fill="#f3f0e9" font-size="24" font-weight="700">22</text>
      <text x="121" y="35" text-anchor="middle" fill="#9aaa87" font-size="18" font-weight="700">I</text><text x="121" y="68" text-anchor="middle" fill="#f3f0e9" font-size="24" font-weight="700">33</text>
      <text x="207" y="35" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">S</text><text x="207" y="68" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">27</text>
      <text x="293" y="35" text-anchor="middle" fill="#9aaa87" font-size="18" font-weight="700">C</text><text x="293" y="68" text-anchor="middle" fill="#f3f0e9" font-size="24" font-weight="700">18</text>
    </g>
    <text x="1005" y="595" fill="#f3f0e9" font-size="18" font-weight="700">Síntese</text>
    <text x="1005" y="626" fill="#bfc2be" font-size="16">Perfil comunicativo e colaborativo,</text><text x="1005" y="651" fill="#bfc2be" font-size="16">com facilidade para criar vínculos e</text><text x="1005" y="676" fill="#bfc2be" font-size="16">manter ritmo constante de trabalho.</text>
    <text x="1005" y="723" fill="#f3f0e9" font-size="18" font-weight="700">Apoio à entrevista</text>
    <text x="1005" y="754" fill="#bfc2be" font-size="16">Explore autonomia, adaptação a mudanças</text><text x="1005" y="779" fill="#bfc2be" font-size="16">e reação a situações de pressão.</text>
  </g>
</svg>
