<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Central de Sistemas e Dashboards do Grupo Culinê</title>
  <desc id="desc">Representação do catálogo com busca, categorias e cards de sistemas e dashboards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17191a"/><stop offset="1" stop-color="#25292b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1435" cy="40" r="280" fill="#fff" opacity=".025"/>
  <text x="90" y="78" fill="#9aaa87" font-family="Arial" font-size="20" font-weight="700" letter-spacing="4">GRUPO CULINÊ</text>
  <text x="90" y="140" fill="#f3f0e9" font-family="Georgia" font-size="52" font-weight="700">Central de Sistemas e Dashboards</text>
  <text x="90" y="184" fill="#bfc2be" font-family="Arial" font-size="23">Um único ponto de acesso para o ecossistema digital do grupo.</text>

  <g font-family="Arial">
    <rect x="90" y="235" width="1420" height="70" rx="20" fill="#292d2f" stroke="#4c5355"/>
    <circle cx="127" cy="270" r="12" fill="none" stroke="#9aaa87" stroke-width="3"/><path d="M136 279 l12 12" stroke="#9aaa87" stroke-width="3"/>
    <text x="165" y="279" fill="#bfc2be" font-size="19">Buscar sistema ou dashboard...</text>
    <rect x="1298" y="250" width="190" height="40" rx="12" fill="#303537"/>
    <text x="1393" y="276" text-anchor="middle" fill="#f3f0e9" font-size="15" font-weight="700">Tema claro / escuro</text>

    <g transform="translate(90 335)">
      <rect width="166" height="48" rx="14" fill="#798768"/><text x="83" y="30" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Sistemas · 12</text>
      <rect x="180" width="178" height="48" rx="14" fill="#303537"/><text x="269" y="30" text-anchor="middle" fill="#f3f0e9" font-size="16" font-weight="700">Dashboards · 10</text>
      <rect x="390" width="92" height="48" rx="14" fill="#303537"/><text x="436" y="30" text-anchor="middle" fill="#bfc2be" font-size="14">Todas</text>
      <rect x="494" width="105" height="48" rx="14" fill="#303537"/><text x="546" y="30" text-anchor="middle" fill="#bfc2be" font-size="14">Compras</text>
      <rect x="611" width="95" height="48" rx="14" fill="#303537"/><text x="658" y="30" text-anchor="middle" fill="#bfc2be" font-size="14">Gestão</text>
      <rect x="718" width="70" height="48" rx="14" fill="#303537"/><text x="753" y="30" text-anchor="middle" fill="#bfc2be" font-size="14">RH</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="90" y="420" width="440" height="180" rx="24" fill="#292d2f" stroke="#4c5355"/>
      <rect x="580" y="420" width="440" height="180" rx="24" fill="#292d2f" stroke="#4c5355"/>
      <rect x="1070" y="420" width="440" height="180" rx="24" fill="#292d2f" stroke="#4c5355"/>
      <rect x="90" y="635" width="440" height="180" rx="24" fill="#292d2f" stroke="#4c5355"/>
      <rect x="580" y="635" width="440" height="180" rx="24" fill="#292d2f" stroke="#4c5355"/>
      <rect x="1070" y="635" width="440" height="180" rx="24" fill="#292d2f" stroke="#4c5355"/>
    </g>

    <g fill="#9aaa87" font-size="14" font-weight="700" letter-spacing="2">
      <text x="120" y="458">COMPRAS</text><text x="610" y="458">GESTÃO</text><text x="1100" y="458">GESTÃO</text>
      <text x="120" y="673">RH</text><text x="610" y="673">RH</text><text x="1100" y="673">GESTÃO</text>
    </g>
    <g fill="#f3f0e9" font-size="25" font-weight="700">
      <text x="120" y="500">Central de Compras</text>
      <text x="610" y="500">Controle da Vitrine</text>
      <text x="1100" y="500">Produção da Cozinha</text>
      <text x="120" y="715">Central de Candidaturas</text>
      <text x="610" y="715">Teste DISC</text>
      <text x="1100" y="715">Controle Logístico</text>
    </g>
    <g fill="#bfc2be" font-size="16">
      <text x="120" y="534">Automação da lista de compras</text><text x="120" y="558">com base no estoque.</text>
      <text x="610" y="534">Controle de validade dos</text><text x="610" y="558">produtos nas lojas.</text>
      <text x="1100" y="534">Lançamentos, metas e</text><text x="1100" y="558">relatórios de produção.</text>
      <text x="120" y="749">Respostas e coleta de</text><text x="120" y="773">currículos em um só lugar.</text>
      <text x="610" y="749">Aplicação e análise do</text><text x="610" y="773">perfil dos candidatos.</text>
      <text x="1100" y="749">Remessas e recebimentos</text><text x="1100" y="773">entre as unidades.</text>
    </g>
  </g>
</svg>
